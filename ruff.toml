line-length = 120
target-version = "py39"

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]
ignore = [
    "E501",  # line-too-long: laissé au formatter
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports

[format]
quote-style = "double"
indent-style = "space"
